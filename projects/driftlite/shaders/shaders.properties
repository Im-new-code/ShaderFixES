# DriftLite shader settings
# Options are declared in the shader sources so they can be toggled in Shader Options.

profile.POTATO = !DL_FOG !DL_COLOR_TUNE !DL_FOLIAGE_TUNE !DL_WATER_TINT !DL_SKY_TUNE
profile.BALANCED = DL_FOG DL_COLOR_TUNE DL_FOLIAGE_TUNE DL_WATER_TINT DL_SKY_TUNE

screen = [VISUALS] [PERFORMANCE]
screen.VISUALS = DL_COLOR_TUNE DL_FOLIAGE_TUNE DL_WATER_TINT DL_SKY_TUNE
screen.PERFORMANCE = DL_FOG
