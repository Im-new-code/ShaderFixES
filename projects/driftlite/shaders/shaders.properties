# DriftLite shader settings
oldLighting=false
oldHandLight=false
dynamicHandLight=false
# Shader-drawn Flat clouds are used; the Minecraft cloud setting may override this.
clouds=off
texture.gbuffers.noisetex=/lib/driftlite-cloud-noise.png

profile.POTATO = !DL_WORLD_LIGHTING !DL_FOG !DL_COLOR_TUNE !DL_FOLIAGE_TUNE !DL_WATER_TINT !DL_SKY_TUNE !DL_SKY_HAZE !DL_BLOOM !DL_EMISSIVE_GLOW !DL_HANDHELD_LIGHTS !DL_ITEM_GLOW DL_FLAT_CLOUDS
profile.BALANCED = DL_WORLD_LIGHTING DL_FOG DL_COLOR_TUNE DL_FOLIAGE_TUNE DL_WATER_TINT DL_SKY_TUNE DL_SKY_HAZE DL_BLOOM DL_EMISSIVE_GLOW DL_HANDHELD_LIGHTS DL_ITEM_GLOW DL_FLAT_CLOUDS

screen = [VISUALS] [SKY] [LIGHTING] [PERFORMANCE]
screen.VISUALS = DL_COLOR_TUNE DL_FOLIAGE_TUNE DL_WATER_TINT DL_SKY_TUNE DL_SKY_HAZE
screen.SKY = DL_FLAT_CLOUDS DL_CLOUD_OPACITY DL_CLOUD_AMOUNT DL_CLOUD_SPEED
screen.LIGHTING = DL_WORLD_LIGHTING DL_LIGHT_FALLOFF DL_EMISSIVE_GLOW DL_HANDHELD_LIGHTS DL_ITEM_GLOW
screen.PERFORMANCE = DL_FOG DL_BLOOM

sliders = DL_CLOUD_OPACITY DL_CLOUD_AMOUNT DL_CLOUD_SPEED DL_LIGHT_FALLOFF

size.buffer.colortex1 = 0.5 0.5
size.buffer.colortex2 = 0.5 0.5

program.world0/composite.enabled = DL_BLOOM
program.world0/composite2.enabled = DL_BLOOM
program.world-1/composite.enabled = DL_BLOOM
program.world-1/composite2.enabled = DL_BLOOM
program.world1/composite.enabled = DL_BLOOM
program.world1/composite2.enabled = DL_BLOOM
program.world_modded/composite.enabled = DL_BLOOM
program.world_modded/composite2.enabled = DL_BLOOM
