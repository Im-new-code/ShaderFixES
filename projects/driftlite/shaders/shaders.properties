# DriftLite shader settings
oldLighting=false
oldHandLight=false
dynamicHandLight=false
clouds=off
texture.gbuffers.noisetex=/lib/driftlite-cloud-noise.png

profile.POTATO = !DL_WORLD_LIGHTING !DL_FOG !DL_COLOR_TUNE !DL_FOLIAGE_TUNE !DL_WATER_TINT !DL_WATER_FOAM !DL_SKY_TUNE !DL_SKY_HAZE !DL_BLOOM !DL_EMISSIVE_GLOW !DL_HANDHELD_LIGHTS !DL_ITEM_GLOW !WORLD_OUTLINE DL_FLAT_CLOUDS
profile.BALANCED = DL_WORLD_LIGHTING DL_FOG DL_COLOR_TUNE DL_FOLIAGE_TUNE DL_WATER_TINT DL_WATER_FOAM DL_SKY_TUNE DL_SKY_HAZE DL_EMISSIVE_GLOW DL_HANDHELD_LIGHTS DL_ITEM_GLOW WORLD_OUTLINE DL_COLOR_GRADING DL_FLAT_CLOUDS DL_BLOOM
profile.REIMAGINED = DL_WORLD_LIGHTING DL_FOG DL_COLOR_TUNE DL_FOLIAGE_TUNE DL_WATER_TINT DL_WATER_FOAM DL_SKY_TUNE DL_SKY_HAZE DL_EMISSIVE_GLOW DL_HANDHELD_LIGHTS DL_ITEM_GLOW WORLD_OUTLINE DL_COLOR_GRADING DL_FLAT_CLOUDS !DL_BLOOM

screen = [VISUALS] [SKY] [WATER] [LIGHTING] [OUTLINES] [COLOR_GRADING] [PERFORMANCE]
screen.VISUALS = DL_COLOR_TUNE DL_FOLIAGE_TUNE DL_SKY_TUNE DL_SKY_HAZE
screen.SKY = DL_FLAT_CLOUDS DL_CLOUD_OPACITY DL_CLOUD_AMOUNT DL_CLOUD_SPEED
screen.WATER = DL_WATER_TINT DL_WATER_FOAM DL_FOAM_STRENGTH
screen.LIGHTING = DL_WORLD_LIGHTING DL_LIGHT_FALLOFF DL_EMISSIVE_GLOW DL_HANDHELD_LIGHTS DL_ITEM_GLOW
screen.OUTLINES = WORLD_OUTLINE WORLD_OUTLINE_THICKNESS WORLD_OUTLINE_I WORLD_OUTLINE_DISTANCE_FADE WORLD_OUTLINE_MIN_DISTANCE WORLD_OUTLINE_THRESHOLD
screen.COLOR_GRADING = DL_COLOR_GRADING DL_EXPOSURE DL_SATURATION DL_VIBRANCE DL_CONTRAST
screen.PERFORMANCE = DL_FOG DL_BLOOM

sliders = DL_CLOUD_OPACITY DL_CLOUD_AMOUNT DL_CLOUD_SPEED DL_LIGHT_FALLOFF DL_FOAM_STRENGTH WORLD_OUTLINE_THICKNESS WORLD_OUTLINE_I WORLD_OUTLINE_DISTANCE_FADE WORLD_OUTLINE_MIN_DISTANCE WORLD_OUTLINE_THRESHOLD DL_EXPOSURE DL_SATURATION DL_VIBRANCE DL_CONTRAST

size.buffer.colortex1 = 1.0 1.0
size.buffer.colortex2 = 0.5 0.5
size.buffer.colortex3 = 0.5 0.5

program.world0/composite1.enabled = DL_BLOOM
program.world0/composite2.enabled = DL_BLOOM
program.world-1/composite1.enabled = DL_BLOOM
program.world-1/composite2.enabled = DL_BLOOM
program.world1/composite1.enabled = DL_BLOOM
program.world1/composite2.enabled = DL_BLOOM
program.world_modded/composite1.enabled = DL_BLOOM
program.world_modded/composite2.enabled = DL_BLOOM
