name: Build Cyan Sky Fog

on:
  push:
    branches:
      - port/cyan-sky-standalone-fog-mod
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 7.3.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.3.3'
      - name: Build remapped mod JAR
        run: gradle --no-daemon clean build
      - name: Verify mod JAR metadata
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'cyan-sky-fog-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -q '^fabric.mod.json$'
          jar tf "$jar_file" | grep -q '^cyan_sky.mixins.json$'
          jar tf "$jar_file" | grep -q 'io/github/imnewcode/cyansky/mixin/BiomeMixin.class'
          jar tf "$jar_file" | grep -q 'io/github/imnewcode/cyansky/mixin/BackgroundRendererMixin.class'
          echo "Verified package: $jar_file"
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cyan-sky-fog-mc1.17.1
          path: build/libs/cyan-sky-fog-*.jar
          if-no-files-found: error
