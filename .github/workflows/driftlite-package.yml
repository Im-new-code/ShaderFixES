name: DriftLite shader package

on:
  push:
    branches:
      - create/driftlite-mobile-performance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Validate shader files
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("projects/driftlite/shaders")
          required = [
              "shaders.properties", "block.properties", "lang/en_US.lang",
              "gbuffers_terrain.vsh", "gbuffers_terrain.fsh",
              "shadow.vsh", "shadow.fsh",
              "gbuffers_entities.vsh", "gbuffers_entities.fsh",
              "gbuffers_textured.vsh", "gbuffers_textured.fsh",
              "gbuffers_textured_lit.vsh", "gbuffers_textured_lit.fsh",
              "gbuffers_skybasic.vsh", "gbuffers_skybasic.fsh",
              "gbuffers_skytextured.vsh", "gbuffers_skytextured.fsh",
              "gbuffers_clouds.vsh", "gbuffers_clouds.fsh",
              "gbuffers_water.vsh", "gbuffers_water.fsh",
              "gbuffers_weather.vsh", "gbuffers_weather.fsh",
              "gbuffers_hand.vsh", "gbuffers_hand.fsh",
              "composite.vsh", "composite.fsh",
              "composite1.vsh", "composite1.fsh",
              "composite2.vsh", "composite2.fsh",
              "final.vsh", "final.fsh",
              "lib/driftlite-cloud-noise.png",
              "lib/MELLOW_MIT_NOTICE.txt",
              "lib/WORLD_OUTLINE_NOTICE.txt",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("Missing shader files: " + ", ".join(missing))
          for path in root.rglob("*"):
              if path.suffix in {".vsh", ".fsh"}:
                  source = path.read_text(encoding="utf-8")
                  if "#version 120" not in source:
                      raise SystemExit(f"{path}: expected GLSL 1.20")
                  if source.count("{") != source.count("}"):
                      raise SystemExit(f"{path}: unbalanced braces")
          properties = (root / "shaders.properties").read_text(encoding="utf-8")
          if "program.world0/composite.enabled" in properties:
              raise SystemExit("Bloom must not disable the always-on scene/outline composite pass.")
          print("File/version/brace checks passed.")
          PY
      - name: Compile GLSL 1.20 stages
        run: |
          set -eu
          for shader in projects/driftlite/shaders/*.vsh; do
            echo "Compile vertex: $shader"
            glslangValidator -S vert "$shader"
          done
          for shader in projects/driftlite/shaders/*.fsh; do
            echo "Compile fragment: $shader"
            glslangValidator -S frag "$shader"
          done
      - name: Package shader ZIP
        run: |
          mkdir -p dist
          cd projects/driftlite
          zip -r ../../dist/DriftLite-OptiFine-1.17.1.zip shaders
      - name: Upload shader artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriftLite-OptiFine-1.17.1
          path: dist/DriftLite-OptiFine-1.17.1.zip
          if-no-files-found: error
          retention-days: 30
